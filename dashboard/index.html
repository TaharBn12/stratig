<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لوحة تحكم ستراتيج</title>
<style>
  :root{
    --bg:#0d1117; --card:#161b22; --line:#26303d; --text:#e6edf3;
    --dim:#8b949e; --up:#3fb950; --down:#f85149; --warn:#d29922; --accent:#58a6ff;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
       font-family:"Segoe UI",Tahoma,"Noto Kufi Arabic",sans-serif;font-size:15px}
  .wrap{max-width:1100px;margin:0 auto;padding:16px}
  header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;
         border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:16px}
  h1{font-size:20px;margin:0;flex:1}
  .badge{padding:3px 9px;border-radius:20px;font-size:12px;border:1px solid var(--line);
         background:var(--card);color:var(--dim)}
  .badge.live{color:var(--up);border-color:var(--up)}
  .badge.test{color:var(--warn);border-color:var(--warn)}
  .badge.off{color:var(--down);border-color:var(--down)}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}
  .card .k{font-size:12px;color:var(--dim);margin-bottom:6px}
  .card .v{font-size:22px;font-weight:600}
  .up{color:var(--up)} .down{color:var(--down)} .warn{color:var(--warn)} .dim{color:var(--dim)}
  section{margin-bottom:18px}
  h2{font-size:15px;color:var(--dim);font-weight:600;margin:0 0 8px}
  svg{width:100%;height:150px;background:var(--card);border:1px solid var(--line);border-radius:10px}
  table{width:100%;border-collapse:collapse;background:var(--card);
        border:1px solid var(--line);border-radius:10px;overflow:hidden;font-size:13px}
  th,td{padding:7px 9px;text-align:right;border-bottom:1px solid var(--line)}
  th{color:var(--dim);font-weight:500;background:#12171f}
  tr:last-child td{border-bottom:none}
  .empty{color:var(--dim);font-size:13px;padding:12px;text-align:center;
         background:var(--card);border:1px dashed var(--line);border-radius:10px}
  footer{color:var(--dim);font-size:12px;text-align:center;padding:14px 0;
         border-top:1px solid var(--line);margin-top:8px}
  input{padding:7px 10px;border-radius:8px;border:1px solid var(--line);
        background:var(--bg);color:var(--text);width:190px}
  button{padding:7px 12px;border-radius:8px;border:1px solid var(--line);
         background:var(--card);color:var(--text);cursor:pointer}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>لوحة تحكم ستراتيج</h1>
    <span id="src" class="badge">…</span>
    <span id="mode" class="badge">…</span>
    <span id="net" class="badge">…</span>
    <span id="age" class="badge">…</span>
    <button id="setupBtn">⚙️ الإعداد</button>
  </header>

  <div id="setup" class="card" style="display:none;margin-bottom:16px">
    <div class="k">اربط اللوحة بـ Supabase — تُحفظ الإعدادات في هذا المتصفح فقط</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px">
      <input id="inUrl" placeholder="https://xxxx.supabase.co">
      <input id="inKey" placeholder="المفتاح القابل للنشر (anon)">
      <input id="inBot" placeholder="bot_id">
      <button id="saveBtn">حفظ</button>
    </div>
    <div class="k" style="margin-top:8px">
      المفتاح يبقى في متصفحك ولا يُرسل إلا إلى Supabase. استخدم المفتاح
      <b>القابل للنشر</b> لا السرّي — الأول يملك قراءة فقط.
    </div>
  </div>

  <div class="grid" id="kpis"></div>

  <section>
    <h2>منحنى الرصيد التراكمي (USDT)</h2>
    <svg id="curve" viewBox="0 0 600 150" preserveAspectRatio="none"></svg>
  </section>

  <section>
    <h2>الصفقات المفتوحة</h2>
    <div id="positions"></div>
  </section>

  <section>
    <h2>آخر الصفقات المغلقة</h2>
    <div id="trades"></div>
  </section>

  <footer>
    <span id="footer"></span>
  </footer>
</div>

<script>
/* ══════════════════════════════════════════════════════════════
   لوحة تحكم ستراتيج — ملف واحد، بلا أي مكتبة خارجية.
   تعمل بوضعين:
     1) محلي: يقرأ /api/state من خادم البوت على جهازك
     2) سحابي: يقرأ جدول bot_state من Supabase (عبر Vercel)
   ══════════════════════════════════════════════════════════════ */
const REFRESH_MS = 15000;
let CFG = { url: "", key: "", botId: "" };

const q = new URLSearchParams(location.search);
const BOT = q.get("bot") || localStorage.getItem("stratig_bot") || "";
if (q.get("bot")) localStorage.setItem("stratig_bot", q.get("bot"));

const fmt = (n, d = 2) => {
  if (n === null || n === undefined || isNaN(n)) return "—";
  return Number(n).toLocaleString("ar-EG", { minimumFractionDigits: d, maximumFractionDigits: d });
};
const signed = (n, d = 2) => (n > 0 ? "+" : "") + fmt(n, d);
const cls = (n) => (n > 0 ? "up" : n < 0 ? "down" : "dim");

const ago = (ts) => {
  if (!ts) return "—";
  const s = Math.max(0, Date.now() / 1000 - ts);
  if (s < 60) return `قبل ${Math.floor(s)} ثانية`;
  if (s < 3600) return `قبل ${Math.floor(s / 60)} دقيقة`;
  if (s < 86400) return `قبل ${Math.floor(s / 3600)} ساعة`;
  return `قبل ${Math.floor(s / 86400)} يوم`;
};

/* ── مصدر البيانات: إعدادات Vercel (Serverless) أم خادم محلي؟ ── */
async function loadConfig() {
  try {
    const r = await fetch("api/config", { cache: "no-store" });
    if (r.ok) {
      const c = await r.json();
      if (c.url && c.key) return c;
    }
  } catch (e) { /* لا يوجد خادم وظائف → الوضع المحلي */ }
  return { url: "", key: "", botId: "" };
}

async function fetchState() {
  if (CFG.url && CFG.key) {
    const bot = BOT || CFG.botId || "default";
    const r = await fetch(
      `${CFG.url}/rest/v1/bot_state?select=payload,updated_at&bot_id=eq.${encodeURIComponent(bot)}`,
      { headers: { apikey: CFG.key, Authorization: `Bearer ${CFG.key}` }, cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const rows = await r.json();
    if (!rows.length) throw new Error("لا توجد بيانات لهذا البوت بعد");
    return rows[0].payload;
  }
  const r = await fetch("api/state", { cache: "no-store" });
  if (!r.ok) throw new Error("HTTP " + r.status);
  return await r.json();
}

/* ── بطاقات المؤشرات ── */
function renderKpis(s) {
  const st = s.stats || {};
  const risk = s.risk || {};
  const cards = [
    ["الرصيد المتاح (USDT)", fmt(s.balance), ""],
    ["ربح اليوم (USDT)", signed(st.today_pnl), cls(st.today_pnl)],
    ["صافي الربح الكلي", signed(st.total_pnl), cls(st.total_pnl)],
    ["نسبة النجاح", st.count ? fmt(st.win_rate, 1) + "%" : "—", ""],
    ["التوقع (بوحدة R)", st.count ? signed(st.expectancy_r, 3) : "—", cls(st.expectancy_r)],
    ["معامل الربح", st.count ? fmt(st.profit_factor) : "—",
      st.profit_factor >= 1.3 ? "up" : st.profit_factor && st.profit_factor < 1 ? "down" : "warn"],
    ["أقصى سحب (USDT)", fmt(st.max_drawdown), st.max_drawdown > 0 ? "down" : "dim"],
    ["عدد الصفقات", st.count || 0, ""],
    ["صفقات مفتوحة", (s.positions || []).length, ""],
    ["التداول مسموح", risk.trading_allowed ? "نعم" : "موقوف",
      risk.trading_allowed ? "up" : "down"],
    ["صفقات متبقية/ساعة", risk.trades_left ?? "—", ""],
    ["خسائر متتالية", risk.consecutive_losses ?? 0,
      (risk.consecutive_losses || 0) > 0 ? "warn" : "dim"],
  ];
  document.getElementById("kpis").innerHTML = cards.map(([k, v, c]) =>
    `<div class="card"><div class="k">${k}</div><div class="v ${c}">${v}</div></div>`
  ).join("");

  const why = risk.reason ? ` · <span class="warn">${risk.reason}</span>` : "";
  document.getElementById("footer").innerHTML =
    `آخر تحديث: ${ago(s.ts)} · ${s.scans || 0} فحص · ${s.signals || 0} إشارة · ` +
    `${s.opened || 0} صفقة مفتوحة${why}`;
}

/* ── منحنى الرصيد ── */
function renderCurve(points) {
  const svg = document.getElementById("curve");
  const W = 600, H = 150, pad = 10;
  if (!points || points.length < 2) {
    svg.innerHTML = `<text x="300" y="80" fill="#8b949e" text-anchor="middle"
      font-size="14">لا توجد صفقات كافية بعد</text>`;
    return;
  }
  const min = Math.min(0, ...points), max = Math.max(0, ...points);
  const span = (max - min) || 1;
  const x = (i) => pad + (i * (W - 2 * pad)) / (points.length - 1);
  const y = (v) => pad + (H - 2 * pad) * (1 - (v - min) / span);
  const line = points.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
  const last = points[points.length - 1];
  const color = last > 0 ? "#3fb950" : last < 0 ? "#f85149" : "#8b949e";
  const zero = y(0);
  svg.innerHTML = `
    <line x1="${pad}" y1="${zero}" x2="${W - pad}" y2="${zero}"
          stroke="#30363d" stroke-dasharray="4 4"/>
    <polyline points="${line}" fill="none" stroke="${color}" stroke-width="2"/>
    <circle cx="${x(points.length - 1)}" cy="${y(last)}" r="3.5" fill="${color}"/>
    <text x="${pad + 4}" y="16" fill="#8b949e" font-size="11">${fmt(max)}</text>
    <text x="${pad + 4}" y="${H - 6}" fill="#8b949e" font-size="11">${fmt(min)}</text>`;
}

/* ── الجداول ── */
function renderPositions(rows) {
  const box = document.getElementById("positions");
  if (!rows || !rows.length) {
    box.innerHTML = `<div class="empty">لا توجد صفقات مفتوحة</div>`;
    return;
  }
  box.innerHTML = `<table><tr>
      <th>الرمز</th><th>الجهة</th><th>الدخول</th><th>الآن</th>
      <th>الربح غير المحقق</th><th>العائد%</th><th>الوقف</th><th>الهدف</th></tr>` +
    rows.map(p => `<tr>
      <td>${p.symbol}</td>
      <td class="${p.side === "buy" ? "up" : "down"}">${p.side === "buy" ? "شراء" : "بيع"}</td>
      <td>${fmt(p.entry, 4)}</td><td>${fmt(p.mark, 4)}</td>
      <td class="${cls(p.pnl)}">${signed(p.pnl)}</td>
      <td class="${cls(p.roe_pct)}">${signed(p.roe_pct, 1)}%</td>
      <td>${p.stop ? fmt(p.stop, 4) : "—"}</td>
      <td>${p.target ? fmt(p.target, 4) : "—"}</td></tr>`).join("") + `</table>`;
}

function renderTrades(rows) {
  const box = document.getElementById("trades");
  if (!rows || !rows.length) {
    box.innerHTML = `<div class="empty">لا توجد صفقات مغلقة بعد</div>`;
    return;
  }
  box.innerHTML = `<table><tr>
      <th>الرمز</th><th>الجهة</th><th>الربح (USDT)</th><th>بوحدة R</th>
      <th>أُغلقت</th><th>الاستراتيجية</th></tr>` +
    rows.slice(0, 30).map(t => `<tr>
      <td>${t.symbol}</td>
      <td class="${t.side === "buy" ? "up" : "down"}">${t.side === "buy" ? "شراء" : "بيع"}</td>
      <td class="${cls(t.pnl)}">${signed(t.pnl)}</td>
      <td class="${cls(t.r)}">${signed(t.r, 2)}</td>
      <td class="dim">${ago(t.closed_at || t.opened_at)}</td>
      <td class="dim">${t.strategy || "—"}</td></tr>`).join("") + `</table>`;
}

/* ── الترويسة ── */
function renderHeader(s) {
  const src = document.getElementById("src");
  src.textContent = CFG.url ? "سحابة (Supabase)" : "محلي";
  src.className = "badge " + (CFG.url ? "live" : "");

  const mode = document.getElementById("mode");
  mode.textContent = s.dry_run ? "محاكاة" : (s.mode === "auto" ? "تلقائي" : "يدوي");
  mode.className = "badge " + (s.dry_run ? "test" : s.mode === "auto" ? "live" : "");

  const net = document.getElementById("net");
  net.textContent = `${s.exchange || ""} · ${s.testnet ? "تيستنت" : "حقيقي"}`;
  net.className = "badge " + (s.testnet ? "test" : "off");

  const age = document.getElementById("age");
  const stale = Date.now() / 1000 - (s.ts || 0) > 300;
  age.textContent = `${s.strategy || ""} · ${s.timeframe || ""}`;
  age.className = "badge" + (stale ? " test" : "");
}

async function tick() {
  try {
    const s = await fetchState();
    renderHeader(s);
    renderKpis(s);
    renderCurve(s.equity_curve || []);
    renderPositions(s.positions || []);
    renderTrades(s.trades || []);
  } catch (err) {
    document.getElementById("footer").innerHTML =
      `<span class="down">تعذّر جلب البيانات: ${err.message}</span>`;
    document.getElementById("src").textContent = "غير متصل";
    document.getElementById("src").className = "badge off";
    // لا يوجد خادم محلي ولا إعدادات محفوظة → اعرض لوحة الإعداد
    if (!CFG.url) document.getElementById("setup").style.display = "block";
  }
}

/* ── لوحة الإعداد (تعمل حتى بفتح الملف مباشرة بلا أي خادم) ── */
function openSetup() {
  const p = document.getElementById("setup");
  p.style.display = p.style.display === "none" ? "block" : "none";
  document.getElementById("inUrl").value = CFG.url || "";
  document.getElementById("inKey").value = CFG.key || "";
  document.getElementById("inBot").value = BOT || CFG.botId || "";
}

function saveSetup() {
  CFG.url = document.getElementById("inUrl").value.trim().replace(/\/+$/, "");
  CFG.key = document.getElementById("inKey").value.trim();
  CFG.botId = document.getElementById("inBot").value.trim() || "default";
  localStorage.setItem("stratig_url", CFG.url);
  localStorage.setItem("stratig_key", CFG.key);
  localStorage.setItem("stratig_bot", CFG.botId);
  document.getElementById("setup").style.display = "none";
  tick();
}

(async function start() {
  CFG = await loadConfig();
  // لا يوجد خادم وظائف (مثلاً فتحت الملف مباشرة) → الإعدادات من المتصفح
  if (!CFG.url) {
    CFG.url = localStorage.getItem("stratig_url") || "";
    CFG.key = localStorage.getItem("stratig_key") || "";
    CFG.botId = localStorage.getItem("stratig_bot") || "default";
  }
  document.getElementById("setupBtn").onclick = openSetup;
  document.getElementById("saveBtn").onclick = saveSetup;
  await tick();
  setInterval(tick, REFRESH_MS);
})();
</script>
</body>
</html>
