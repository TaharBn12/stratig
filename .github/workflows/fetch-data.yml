name: fetch-data

# ⚠️ أداة داخليّة: تجلب شموعاً حقيقية من OKX وترفعها كـ artifact.
# السبب: بيئة التطوير هنا **بلا إنترنت خارجي**، فلا يمكن تنزيل البيانات
# مباشرة. المستخدم العادي لا يحتاجها — عنده `scripts/fetch_candles.py`
# يعمل على جهازه مباشرة.
#
# التشغيل: بحدث push على ملف داخل data/requests/ (لأن صلاحية
# workflow_dispatch غير متاحة للتكامل هنا)، أو يدوياً من واجهة GitHub.
on:
  push:
    paths:
      - 'data/requests/*.txt'
  workflow_dispatch:
    inputs:
      symbol:
        description: "العملة"
        required: false
        default: "ONEUSDT"
      tf:
        description: "إطار الشمعة"
        required: false
        default: "15m"
      days:
        description: "كم يوماً للخلف"
        required: false
        default: "4"

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: جلب الشموع وطباعتها
        env:
          REQUESTS: data/requests
        run: |
          set -euo pipefail
          mkdir -p data
          # كل سطر في ملف الطلب: SYMBOL=ONEUSDT TF=15m DAYS=4
          cat $REQUESTS/*.txt | while read -r LINE; do
            case "$LINE" in ''|\#*) continue;; esac
            SYM=$(echo "$LINE" | tr ' ' '\n' | awk -F= '/SYMBOL/{print $2}')
            TF=$(echo  "$LINE" | tr ' ' '\n' | awk -F= '/^TF/{print $2}')
            DAY=$(echo "$LINE" | tr ' ' '\n' | awk -F= '/DAYS/{print $2}')
            OUT="data/${SYM}-${TF}.csv"
            echo "=== جلب $SYM $TF آخر $DAY يوماً ==="
            python scripts/fetch_candles.py --symbol "$SYM" --tf "$TF" \
              --days "$DAY" --out "$OUT" --quiet
            echo "عدد الشموع: $(( $(wc -l < "$OUT") - 1 ))"
            head -2 "$OUT"; tail -1 "$OUT"
            # البيانات مضغوطة ومشفّرة base64: بيئة التطوير لا تصل إلى
            # خوادم الـ artifacts، فنمرّرها عبر السجل.
            echo "=== BEGIN $SYM-$TF ==="
            gzip -9 -c "$OUT" | base64 -w 120
            echo "=== END $SYM-$TF ==="
          done
