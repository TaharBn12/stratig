name: fetch-data

# ⚠️ أداة داخليّة: تجلب شموعاً حقيقية من OKX وترفعها كـ artifact.
# السبب: بيئة التطوير هنا **بلا إنترنت خارجي**، فلا يمكن تنزيل البيانات
# مباشرة. المستخدم العادي لا يحتاجها — عنده `scripts/fetch_candles.py`
# يعمل على جهازه مباشرة.
#
# التشغيل: بحدث push على ملف داخل data/requests/ (لأن صلاحية
# workflow_dispatch غير متاحة للتكامل هنا)، أو يدوياً من واجهة GitHub.
on:
  push:
    paths:
      - 'data/requests/*.txt'
  workflow_dispatch:
    inputs:
      symbol:
        description: "العملة"
        required: false
        default: "ONEUSDT"
      tf:
        description: "إطار الشمعة"
        required: false
        default: "15m"
      days:
        description: "كم يوماً للخلف"
        required: false
        default: "4"

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: قراءة الطلب
        id: req
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "symbol=${{ inputs.symbol }}" >> "$GITHUB_OUTPUT"
            echo "tf=${{ inputs.tf }}" >> "$GITHUB_OUTPUT"
            echo "days=${{ inputs.days }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          FILE=$(ls data/requests/*.txt 2>/dev/null | head -1)
          if [ -z "$FILE" ]; then
            echo "لا يوجد ملف طلب"; exit 1
          fi
          echo "الطلب: $FILE"
          cat "$FILE"
          # السطر الأول: SYMBOL=ONEUSDT TF=15m DAYS=4
          LINE=$(grep -m1 -v '^\s*#' "$FILE" | grep -v '^\s*$' || true)
          echo "symbol=$(echo "$LINE" | tr ' ' '\n' | awk -F= '/SYMBOL/{print $2}')" >> "$GITHUB_OUTPUT"
          echo "tf=$(echo "$LINE" | tr ' ' '\n' | awk -F= '/^TF/{print $2}')" >> "$GITHUB_OUTPUT"
          echo "days=$(echo "$LINE" | tr ' ' '\n' | awk -F= '/DAYS/{print $2}')" >> "$GITHUB_OUTPUT"

      - name: جلب الشموع
        run: |
          set -euo pipefail
          mkdir -p data
          python scripts/fetch_candles.py \
            --symbol "${{ steps.req.outputs.symbol }}" \
            --tf "${{ steps.req.outputs.tf }}" \
            --days "${{ steps.req.outputs.days }}" \
            --out "data/${{ steps.req.outputs.symbol }}-${{ steps.req.outputs.tf }}.csv"

      - name: فحص سريع
        run: |
          set -euo pipefail
          F="data/${{ steps.req.outputs.symbol }}-${{ steps.req.outputs.tf }}.csv"
          wc -l "$F"
          head -3 "$F"
          tail -2 "$F"

      - uses: actions/upload-artifact@v4
        with:
          name: candles-${{ steps.req.outputs.symbol }}-${{ steps.req.outputs.tf }}
          path: data/*.csv
