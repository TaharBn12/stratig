services:
  stratig:
    build: .
    container_name: stratig
    restart: unless-stopped
    # كل الأسرار تُقرأ من ملف .env (لا تضعها هنا)
    env_file:
      - .env
    environment:
      TZ: UTC
      PYTHONUNBUFFERED: "1"
    volumes:
      # config.toml قابل للكتابة لأن البوت يحفظ الإعدادات عند استخدام /set
      - ./config.toml:/app/config.toml
      - ./logs:/app/logs
