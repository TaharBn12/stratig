# ════════════════════════════════════════════════════════════════
#  Stratig — ملف الإعدادات المرجعي
# ════════════════════════════════════════════════════════════════
#  هذا الملف يُرفع على GitHub ولا يُستخدم مباشرة.
#  انسخه باسم config.toml ثم عدّل ما تشاء:
#      copy config.example.toml config.toml
#
#  لماذا؟ لأن البوت يحفظ إعداداتك في config.toml أثناء عمله،
#  ولو كان الملف مُتتبَّعاً في git لتعطّل update.bat في كل مرة.
#  (config.toml مذكور في .gitignore)
#
#  المفاتيح السرية لا توضع هنا أبداً — بل في ملف .env
# ════════════════════════════════════════════════════════════════


[exchange]
name = "binance"
testnet = true

[strategy]
name = "rsi_williams"
timeframe = "15m"
candles = 500
# true = الحساب على شمعة **مكتملة** (بدون إعادة رسم) — اتركه true دائماً.
# false = يُحسب على الشمعة الحالية وهي لم تُغلق بعد → الإشارة تظهر ثم تنقلب
use_closed_candles = true
require_both = true

# فلاتر جودة الإشارة (اختيارية، مُعطّلة افتراضياً)
# "إشارات كثيرة لكن ضعيفة": تقلّل العدد وتبقي الأفضل
quality_enabled = false
regime = "off"            # off | trend | range  (حسب ADX)
adx_length = 14
adx_trend_min = 25.0
adx_range_max = 20.0
mtf_enabled = false       # تأكيد من إطار أعلى
mtf_timeframe = "1h"
mtf_ema_period = 50
volatility_min_pct = 0.0
volatility_max_pct = 0.0

[strategy.scalping_i]
ema_slow = 50
ema_fast = 30
rsi_length = 10
bb_length = 15
bb_std = 1.5
bb_ddof = 1
atr_length = 7
atr_mode = "rma"
backcandles = 7
sl_coef = 1.1
tp_sl_ratio = 1.5

[strategy.rsi]
enabled = true
period = 14
oversold = 30
overbought = 70
lookback = 3

[strategy.williams_r]
enabled = true
lbp = 24
ema_window = 24
extreme_oversold = -99.5
extreme_overbought = -0.5
oversold = -75
overbought = -25

[exit]
mode = "percent"
follow_strategy = true
strict = true

[exit.atr]
length = 7
sl_coef = 1.1
tp_ratio = 1.5

[trade]
order_type = "market"
qty_usdt = 50
leverage = 10
margin_mode = "isolated"
take_profit_pct = 0.02
stop_loss_pct = 0.009
tp_trigger = "mark_price"

[risk]
max_positions = 5
min_notional = 20
daily_max_trades = 0
daily_max_loss_usdt = 0

# حجم الصفقة: "fixed" = trade.qty_usdt · "risk" = خسارة ثابتة = نسبة من الرصيد
sizing = "fixed"
risk_per_trade_pct = 0.01
max_qty_usdt = 0
min_qty_usdt = 0

# معدّل الدخول (يمنع الإفراط في التداول في الوضع التلقائي)
max_trades_per_hour = 0
min_gap_seconds = 0

# قاطع الخسائر المتتالية
max_consecutive_losses = 0
pause_after_losses_seconds = 3600

# إدارة الصفقة المفتوحة (اختياري — مُعطّل افتراضياً)
manage_positions = false
manage_interval_seconds = 60
breakeven_after_r = 1.0
breakeven_offset_pct = 0.0006
trailing = false
trail_distance_mult = 1.0
max_hold_seconds = 0

journal_path = "state/trades.json"
journal_limit = 1000

[scanner]
autostart = true
interval_seconds = 120
symbols_source = "manual"
top_n = 40
max_signals_per_scan = 5
manual_symbols = ["AAAUSDT"]
exclude = ["USDCUSDT", "FDUSDUSDT"]
cooldown_seconds = 1800
signal_ttl_seconds = 900
request_delay = 0.2
notify_no_signal = false

[execution]
mode = "manual"

[safety]
dry_run = false

# ── مقياس الميزة: هل استراتيجيتك رابحة إحصائياً؟ ──
# القياس أثبت: المعاملات لا تصنع ميزة من عدم.
# scalping_i اتجاهها الصرف −0.001% على 2065 صفقة = صفر،
# وكل نسب الهدف (1:1 → 5:1) خاسرة معها.
[edge]
enabled = true        # يعرض القياس في /edge
gate = false          # true = يمنع التداول عند ثبوت الخسارة إحصائياً
min_trades = 30       # أقل من هذا = لا حكم (قد يكون حظاً)
lookback = 0          # 0 = كل الصفقات، وإلا آخر N صفقة

# ── لوحة التحكم المحلية (خادم على جهازك) ──
[web]
enabled = false
host = "0.0.0.0"
port = 8000
token = ""                # فارغ = بلا حماية على الشبكة المحلية

# ── الرفع إلى Supabase (للوصول من الهاتف في أي مكان) ──
[supabase]
enabled = false
url = ""                  # https://xxxx.supabase.co
key = ""                  # المفتاح السرّي (service) — للكتابة فقط
bot_id = "default"        # يميّز أكثر من بوت في نفس المشروع
push_interval_seconds = 60

[telegram]
notify_startup = true
notify_scan_summary = false
language = "ar"
