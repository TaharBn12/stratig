
[exchange]
name = "binance"
testnet = true

[strategy]
timeframe = "15m"
candles = 500
use_closed_candles = false
require_both = true

[strategy.rsi]
enabled = true
period = 14
oversold = 30
overbought = 70
lookback = 3

[strategy.williams_r]
enabled = true
lbp = 24
ema_window = 24
extreme_oversold = -99.5
extreme_overbought = -0.5
oversold = -75
overbought = -25

[trade]
order_type = "market"
qty_usdt = 50
leverage = 10
margin_mode = "isolated"
take_profit_pct = 0.02
stop_loss_pct = 0.009
tp_trigger = "mark_price"

[risk]
max_positions = 5
min_notional = 20
daily_max_trades = 0
daily_max_loss_usdt = 0

[scanner]
autostart = true
interval_seconds = 120
symbols_source = "manual"
top_n = 40
max_signals_per_scan = 5
manual_symbols = ["AAAUSDT"]
exclude = ["USDCUSDT", "FDUSDUSDT"]
cooldown_seconds = 1800
signal_ttl_seconds = 900
request_delay = 0.2
notify_no_signal = false

[execution]
mode = "manual"

[safety]
dry_run = false

[telegram]
notify_startup = true
notify_scan_summary = false
language = "ar"
